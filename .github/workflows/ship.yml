name: Ship

# Every merge to main ships itself once CI is green: the API image to Cloud
# Run, the notifications job onto the same image, Firebase Hosting when the
# website changed, and a signed AAB to Play internal testing when the app
# changed, and a signed iOS build to TestFlight when the app changed. Before
# this, the Mac did all of it by hand after each merge, and a Mac that was
# asleep or offline meant nothing shipped. Setup and the one-time steps are in
# docs/ship_from_github.md and docs/ship_ios_testflight.md.
#
# What it never does: change env vars or secrets on Cloud Run (only the image
# moves), apply a Supabase migration (a merge that adds one stops here until
# it is applied and the run is restarted by hand), or touch any Play track
# but internal (scripts/play_upload.py refuses production, and the service
# account has no production rights either), or send an iOS build anywhere
# past TestFlight (scripts/asc.py has no review, release or tester calls).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: 'The new Supabase migrations in this range are applied to production'
        type: boolean
        default: false
      ship_everything:
        description: 'Deploy the server and hosting and upload an AAB and an iOS build even if those files did not change'
        type: boolean
        default: false
  # A pull request that edits this file runs it as a dry run: the image and
  # an unsigned AAB are built, nothing signs in to Google and nothing ships.
  pull_request:
    paths:
      - .github/workflows/ship.yml
      - scripts/play_upload.py
      - scripts/asc.py

# One ship at a time, in merge order. A newer merge waits for the running one
# instead of cancelling it halfway through a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ship-dry-{0}', github.ref) || 'ship-main' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read     # find the last successful ship, to know what changed since
  id-token: write   # Workload Identity Federation: no Google key in GitHub

env:
  PROJECT_ID: gen-lang-client-0058562386
  REGION: asia-south1
  SERVICE: agentic-astrospace
  WORKER_JOB: agentic-astrospace-notifications
  IMAGE_REPO: asia-south1-docker.pkg.dev/gen-lang-client-0058562386/cloud-run-source-deploy/agentic-astrospace
  API_URL: https://agentic-astrospace-cwuqybpnzq-el.a.run.app
  DEPLOYER_SA: github-deployer@gen-lang-client-0058562386.iam.gserviceaccount.com
  PLAY_SA: play-publisher@gen-lang-client-0058562386.iam.gserviceaccount.com

# Every job runs where the BUILD_RUNNER repository variable says: unset, on
# GitHub's machines; set to siddha-mac, on the Mac mini, where a private repo
# builds for free (docs/build_runner.md). On the Mac each job keeps gcloud's
# sign-in in its own temporary folder, so the Mac's own gcloud account is
# never switched, and removes every key it wrote before it ends.
jobs:
  plan:
    name: What changed
    # Only a green CI run from a push to main ships; a red one ships nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      dry: ${{ steps.plan.outputs.dry }}
      server: ${{ steps.plan.outputs.server }}
      hosting: ${{ steps.plan.outputs.hosting }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Work out what to ship
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
          SHIP_EVERYTHING: ${{ inputs.ship_everything }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = pull_request ]; then
            echo "Dry run for a pull request: build everything, ship nothing."
            { echo dry=true; echo server=true; echo hosting=false; echo android=true; echo ios=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo dry=false >> "$GITHUB_OUTPUT"

          # CI runs can finish out of order. Shipping an older commit after a
          # newer one would roll the server back, so only the tip of main ships;
          # the newer commit's own run ships everything since the last ship.
          git fetch -q origin main
          TIP=$(git rev-parse origin/main)
          if [ "$SHA" != "$TIP" ]; then
            echo "::notice::$SHA is no longer the tip of main ($TIP); its run will ship this too."
            { echo server=false; echo hosting=false; echo android=false; echo ios=false; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff against the last ship that fully succeeded, so a failed run's
          # changes are carried into the next one rather than lost.
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ship.yml/runs?branch=main&status=success&per_page=30" \
            --jq "[.workflow_runs[] | select(.head_sha != \"$SHA\" and .event != \"pull_request\") | .head_sha][0] // empty")
          if [ -z "$BASE" ] || ! git merge-base --is-ancestor "$BASE" "$SHA"; then
            BASE=$(git rev-parse "$SHA~1")
          fi
          echo "Changes since $BASE:"
          git diff --name-only "$BASE" "$SHA" | tee changed.txt

          if [ "$SHIP_EVERYTHING" = true ]; then
            { echo server=true; echo hosting=true; echo android=true; echo ios=true; } >> "$GITHUB_OUTPUT"
          else
            has() {
              local hits
              hits=$(grep -E "$1" changed.txt | grep -vE "${2:-^$}" || true)
              [ -n "$hits" ] && echo true || echo false
            }
            echo "server=$(has '^(astrospace/|main\.py$|setup\.py$|requirements\.txt$|Dockerfile$|\.dockerignore$|ui/)' '^ui/(android|ios|e2e)/|\.spec\.ts$')" >> "$GITHUB_OUTPUT"
            echo "hosting=$(has '^(firebase\.json$|firebase-public/)')" >> "$GITHUB_OUTPUT"
            echo "android=$(has '^ui/' '^ui/(ios|e2e)/|\.spec\.ts$')" >> "$GITHUB_OUTPUT"
            echo "ios=$(has '^ui/' '^ui/(android|e2e)/|\.spec\.ts$')" >> "$GITHUB_OUTPUT"
          fi

          # Migrations are applied by a person (Mac: supabase db push, or the
          # SQL Editor), never from here. New code can depend on a new table,
          # so nothing ships until someone says the migration is in.
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BASE" "$SHA" -- supabase/migrations)
          if [ -n "$NEW_MIGRATIONS" ] && [ "$MIGRATIONS_APPLIED" != true ]; then
            for f in $NEW_MIGRATIONS; do echo "::error file=$f::New migration, not applied by CI: $f"; done
            {
              echo "### Stopped: new Supabase migration"
              echo
              echo "This range adds:"
              for f in $NEW_MIGRATIONS; do echo "- \`$f\`"; done
              echo
              echo "Apply it to production first, then **Actions › Ship › Run workflow** on main"
              echo "with *migrations applied* ticked. Nothing was deployed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  server:
    name: API + worker (Cloud Run)
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - id: image
        run: echo "image=$IMAGE_REPO:${{ needs.plan.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: gcloud settings in this job's temporary folder
        run: echo "CLOUDSDK_CONFIG=$RUNNER_TEMP/gcloud" >> "$GITHUB_ENV"

      - id: auth
        if: needs.plan.outputs.dry != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - if: needs.plan.outputs.dry != 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: needs.plan.outputs.dry != 'true'
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # The same Dockerfile `gcloud run deploy --source .` built on Cloud
      # Build, from a clean checkout, so nothing untracked on a laptop can
      # slip into the image.
      - name: Build${{ needs.plan.outputs.dry != 'true' && ' and push' || '' }} the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # What Cloud Run runs, whichever machine builds it.
          platforms: linux/amd64
          push: ${{ needs.plan.outputs.dry != 'true' }}
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the API (image only; env vars and secrets untouched)
        if: needs.plan.outputs.dry != 'true'
        run: |
          gcloud run deploy "$SERVICE" --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: API answers health
        if: needs.plan.outputs.dry != 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$API_URL/api/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::$API_URL/api/health did not answer after the deploy"
          exit 1

      - name: Move the notifications job onto the API's image
        if: needs.plan.outputs.dry != 'true'
        run: |
          gcloud run jobs update "$WORKER_JOB" --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Summary
        if: needs.plan.outputs.dry != 'true'
        run: |
          REV=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')
          {
            echo "### Server shipped"
            echo "- API revision \`$REV\`"
            echo "- Worker job \`$WORKER_JOB\` on the same image"
            echo "- Image \`${{ steps.image.outputs.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  hosting:
    name: Website (Firebase Hosting)
    needs: [plan, server]
    # After the server, because Hosting rewrites /api to it; skipped server is fine.
    if: >-
      !cancelled() && needs.plan.outputs.hosting == 'true' && needs.plan.outputs.dry != 'true' &&
      needs.server.result != 'failure'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: gcloud settings in this job's temporary folder
        run: echo "CLOUDSDK_CONFIG=$RUNNER_TEMP/gcloud" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy hosting
        run: |
          npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" \
            --non-interactive --message "${{ needs.plan.outputs.sha }}"
          echo "### Website shipped (asksiddha.app)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: AAB to Play internal testing
    needs: [plan, server]
    # After the server, so a new build never reaches phones before the API it
    # talks to. A skipped server deploy (app-only change) is fine.
    if: >-
      !cancelled() && needs.plan.outputs.android == 'true' && needs.server.result != 'failure'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    env:
      DRY: ${{ needs.plan.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # versionCode is the commit count; a shallow clone would count the depth.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK on the Mac mini
        # GitHub's machines set ANDROID_HOME; on the Mac it is Android
        # Studio's SDK unless the runner's .env says otherwise.
        if: runner.environment == 'self-hosted'
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            [ -d "$HOME/Library/Android/sdk" ] || { echo "::error::No Android SDK; set ANDROID_HOME in the runner's .env (docs/build_runner.md)"; exit 1; }
            echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          fi

      - name: Signing key and Firebase config from secrets
        if: env.DRY != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          # The existing upload key enrolled in Play App Signing. A build
          # signed with any other key is refused by Play, so a missing secret
          # stops here rather than producing an unusable bundle.
          for name in KEYSTORE_B64 KEYSTORE_PROPERTIES GOOGLE_SERVICES_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret for $name is not set (docs/ship_from_github.md)"; exit 1
            fi
          done
          umask 077
          printf %s "$KEYSTORE_B64" | base64 -d > ui/android/upload-key.jks
          # The Mac's file may point storeFile elsewhere; here the key sits next to it.
          printf '%s\n' "$KEYSTORE_PROPERTIES" | grep -v '^storeFile=' > ui/android/keystore.properties
          echo 'storeFile=upload-key.jks' >> ui/android/keystore.properties
          # Without it the push plugin is not applied and notifications never arrive.
          printf %s "$GOOGLE_SERVICES_B64" | base64 -d > ui/android/app/google-services.json

      - name: Web bundle into the Android project
        working-directory: ui
        # build:native without the iOS sync, which needs a Mac.
        run: |
          npm ci
          npm run version:sync
          npm run build
          node scripts/clean-generated-artifacts.mjs --before-cap-sync
          npx cap sync android
          node scripts/clean-generated-artifacts.mjs --after-cap-sync

      - name: versionCode is the commit count
        id: vc
        run: |
          VC=$(git rev-list --count HEAD)
          grep -q "versionCode $VC\$" ui/android/app/build.gradle || {
            echo "::error::ui/android/app/build.gradle does not carry versionCode $VC"; exit 1; }
          echo "vc=$VC" >> "$GITHUB_OUTPUT"

      - name: Build the ${{ env.DRY == 'true' && 'unsigned' || 'signed' }} AAB
        working-directory: ui/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload key fingerprint (public; must match Play's upload certificate)
        if: env.DRY != 'true'
        run: keytool -printcert -jarfile ui/android/app/build/outputs/bundle/release/app-release.aab | grep -E 'SHA1|SHA256'

      - name: Keep the AAB
        uses: actions/upload-artifact@v4
        with:
          name: asksiddha-${{ steps.vc.outputs.vc }}${{ env.DRY == 'true' && '-unsigned' || '' }}
          path: ui/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - id: play-auth
        if: env.DRY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      # What's new for testers (docs/release_announcements.md): the merged
      # pull requests since the build closed testers hold, in plain words,
      # and a preview email to the team. Nothing reaches readers here, and a
      # failure never stops the upload; Play then gets the commit subject.
      - name: Build testers have now
        id: testers
        if: env.DRY != 'true'
        continue-on-error: true
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
        run: echo "vc=$(python3 scripts/play_upload.py --track alpha --highest)" >> "$GITHUB_OUTPUT"

      - id: release-auth
        if: env.DRY != 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ env.API_URL }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Draft what's new
        if: env.DRY != 'true' && steps.release-auth.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ steps.release-auth.outputs.id_token }}
          VC: ${{ steps.vc.outputs.vc }}
          SINCE: ${{ steps.testers.outputs.vc || '0' }}
        run: |
          set -euo pipefail
          python3 scripts/release_changes.py --since "$SINCE" > changes.json
          jq -n --argjson vc "$VC" --slurpfile c changes.json '{version_code: $vc, changes: $c[0]}' |
            curl -fsS -X POST "$API_URL/api/v1/releases/draft" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' --data @- > release-notes.json
          {
            echo "### What's new (draft, since build $SINCE)"
            jq -r '.notes[] | "- " + .' release-notes.json
            echo
            echo "Preview emailed to the team. Testers get it on \"broadcast update\" (Actions › Announce)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the draft
        if: hashFiles('release-notes.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.vc.outputs.vc }}
          path: release-notes.json
          retention-days: 90

      - name: Upload to internal testing
        if: env.DRY != 'true'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          VC: ${{ steps.vc.outputs.vc }}
        run: |
          NOTES=$(jq -r '.play_notes // empty' release-notes.json 2>/dev/null || true)
          # Never the commit title: it can name a revert, a PR number or a
          # surprise held for later (Hawk, 2026-10-29).
          [ -n "$NOTES" ] || NOTES="Small fixes and improvements."
          # --skip-if-not-above: if the Mac already sent this commit, do nothing.
          python3 scripts/play_upload.py ui/android/app/build/outputs/bundle/release/app-release.aab \
            --track internal --notes "$NOTES" --skip-if-not-above "$VC" | tee play.txt
          echo "### AAB versionCode $VC" >> "$GITHUB_STEP_SUMMARY"
          cat play.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key and Firebase config
        # A self-hosted runner keeps its work folder between runs.
        if: always()
        run: rm -f ui/android/upload-key.jks ui/android/keystore.properties ui/android/app/google-services.json

  ios:
    name: iOS build to TestFlight
    needs: [plan, server]
    # After the server, like the AAB. Upload only: the internal TestFlight
    # group picks it up by itself; the external group, App Review and any App
    # Store release stay decisions made in App Store Connect by a person.
    if: >-
      !cancelled() && needs.plan.outputs.ios == 'true' && needs.server.result != 'failure'
    # Xcode 26 is what Apple requires uploads to be built with; the Mac mini
    # has it, and so does GitHub's macos-26 image.
    runs-on: ${{ vars.BUILD_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      DRY: ${{ needs.plan.outputs.dry }}
      TEAM_ID: 65G6LHRKWB
      BUNDLE_ID: app.asksiddha.mobile
      WIDGETS_BUNDLE_ID: app.asksiddha.mobile.widgets
      PROJECT: ui/ios/App/App.xcodeproj
      KEYCHAIN: ${{ github.workspace }}/../ship.keychain-db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The build number is the commit count; a shallow clone would count the depth.
          fetch-depth: 0

      - name: Newest Xcode 26
        # GitHub's image holds several Xcodes; the Mac mini uses the one it
        # has selected (no sudo there) and only checks that it is 26 or newer.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            XV=$(xcodebuild -version | sed -n 1p)
            MAJOR=$(echo "$XV" | sed -E 's/^Xcode ([0-9]+).*/\1/')
            [ "${MAJOR:-0}" -ge 26 ] 2>/dev/null || {
              echo "::error::The Mac's selected Xcode is older than 26: $XV"; exit 1; }
          else
            XC=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|_rc' | sort -V | tail -1)
            sudo xcode-select -s "$XC/Contents/Developer"
          fi
          xcodebuild -version

      - name: App Store Connect key from secrets
        id: key
        if: env.DRY != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Before the one-time setup none of these exist: say so and skip,
          # so Ship stays green for the server and Android. Some but not all
          # set is a broken setup and fails.
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64 P12_B64 P12_PASSWORD; do
            [ -n "${!name}" ] || missing=$((missing + 1))
          done
          if [ "$missing" = 5 ]; then
            echo "::warning::iOS upload is not set up yet (docs/ship_ios_testflight.md); skipped."
            echo "### iOS: skipped, not set up yet (docs/ship_ios_testflight.md)" >> "$GITHUB_STEP_SUMMARY"
            echo configured=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64 P12_B64 P12_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret for $name is not set (docs/ship_ios_testflight.md)"; exit 1
            fi
          done
          echo configured=true >> "$GITHUB_OUTPUT"
          # In this job's temporary folder, never ~/.appstoreconnect: on the
          # Mac mini that folder holds the Mac's own keys. altool finds it by
          # its ID through API_PRIVATE_KEYS_DIR; asc.py is pointed at it.
          umask 077
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          printf %s "$ASC_KEY_P8_B64" | base64 --decode > "$KEY_FILE"
          { echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; echo "ASC_KEY_FILE=$KEY_FILE"; echo "API_PRIVATE_KEYS_DIR=$KEY_DIR"; } >> "$GITHUB_ENV"

      - name: Build number is the commit count
        id: vc
        env:
          CONFIGURED: ${{ steps.key.outputs.configured }}
        run: |
          set -euo pipefail
          VC=$(git rev-list --count HEAD)
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          if [ "$DRY" = true ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CONFIGURED" != true ]; then echo go=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # If the Mac already uploaded this commit (or a later one), Apple
          # would refuse the same number again. Nothing to do.
          LATEST=$(python3 scripts/asc.py latest-build)
          if [ "$LATEST" -ge "$VC" ]; then
            echo "::notice::App Store Connect already has build $LATEST; $VC is not above it. Skipped."
            echo "### iOS: skipped (build $LATEST already in App Store Connect, this is $VC)" >> "$GITHUB_STEP_SUMMARY"
            echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.vc.outputs.go == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Web bundle into the iOS project
        if: steps.vc.outputs.go == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run version:sync
          npm run build
          node scripts/clean-generated-artifacts.mjs --before-cap-sync
          npx cap sync ios
          node scripts/clean-generated-artifacts.mjs --after-cap-sync
          grep -q "CURRENT_PROJECT_VERSION = ${{ steps.vc.outputs.vc }};" ios/App/App.xcodeproj/project.pbxproj || {
            echo "::error::project.pbxproj does not carry build ${{ steps.vc.outputs.vc }}"; exit 1; }

      - name: Distribution certificate into a throwaway keychain
        if: steps.vc.outputs.go == 'true' && env.DRY != 'true'
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          umask 077
          printf %s "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # Apple's intermediate, in case the image lacks it; codesign needs the chain.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" || {
            echo "::error::No Apple Distribution identity in the p12 (docs/ship_ios_testflight.md)"; exit 1; }

      - name: App Store provisioning profile (found or made by asc.py)
        id: profile
        if: steps.vc.outputs.go == 'true' && env.DRY != 'true'
        run: |
          set -euo pipefail
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" | openssl x509 -noout -serial)
          # One profile for the app and one for the widget extension
          # (ui/ios/App/SiddhaWidgets), both signed by the same certificate.
          install() {
            python3 scripts/asc.py profile --bundle "$1" --serial "$SERIAL" --out "$RUNNER_TEMP/$2.mobileprovision" > "$2.txt"
            NAME=$(sed -n 's/^name=//p' "$2.txt")
            UUID=$(sed -n 's/^uuid=//p' "$2.txt")
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$d"; cp "$RUNNER_TEMP/$2.mobileprovision" "$d/$UUID.mobileprovision"
              # Removed again at the end of the job.
              echo "$d/$UUID.mobileprovision" >> "$RUNNER_TEMP/installed-profiles.txt"
            done
            echo "$3=$NAME" >> "$GITHUB_OUTPUT"
            echo "Profile for $1: $NAME ($UUID)"
          }
          install "$BUNDLE_ID" ci name
          install "$WIDGETS_BUNDLE_ID" ci-widgets widgets

      - name: Sign the app and widget targets with those profiles (this checkout only)
        if: steps.vc.outputs.go == 'true' && env.DRY != 'true'
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          WIDGETS_PROFILE_NAME: ${{ steps.profile.outputs.widgets }}
        # The Mac signs automatically through Xcode's account. A runner has no
        # account, so only the App and SiddhaWidgets targets' Release settings
        # switch to manual signing here. Passing these on the xcodebuild command line instead
        # would apply them to the Swift packages too, which refuse profiles.
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          proj = pathlib.Path(os.environ["PROJECT"]) / "project.pbxproj"
          text = proj.read_text()
          # Each target's Release configuration: PBXNativeTarget "App", then
          # the widget extension "SiddhaWidgets".
          for target, marker, profile in [
              ("App", "504EC3181FED79650016851F /* Release */ = {", os.environ["PROFILE_NAME"]),
              ("SiddhaWidgets", "A1D9E7300000000000000028 /* Release */ = {", os.environ["WIDGETS_PROFILE_NAME"]),
          ]:
              if marker not in text:
                  sys.exit(f"::error::{target} target Release configuration not found; update ship.yml's marker")
              start = text.index(marker)
              end = text.index("name = Release;", start)
              block = text[start:end]
              if "CODE_SIGN_STYLE = Automatic;" not in block:
                  sys.exit(f"::error::{target} target Release no longer uses automatic signing; update ship.yml")
              manual = "\n\t\t\t\t".join([
                  "CODE_SIGN_STYLE = Manual;",
                  'CODE_SIGN_IDENTITY = "Apple Distribution";',
                  f"DEVELOPMENT_TEAM = {os.environ['TEAM_ID']};",
                  f"PROVISIONING_PROFILE_SPECIFIER = \"{profile}\";",
              ])
              text = text[:start] + block.replace("CODE_SIGN_STYLE = Automatic;", manual) + text[end:]
          proj.write_text(text)
          # TestFlight and the App Store use production push; the committed
          # file says development for runs from Xcode.
          ent = pathlib.Path("ui/ios/App/App/App.entitlements")
          ent.write_text(ent.read_text().replace(
              "<key>aps-environment</key>\n\t<string>development</string>",
              "<key>aps-environment</key>\n\t<string>production</string>"))
          if "<string>production</string>" not in ent.read_text():
              sys.exit("::error::could not set aps-environment to production")
          PY

      - name: Archive${{ env.DRY == 'true' && ' (unsigned, dry run)' || '' }}
        if: steps.vc.outputs.go == 'true'
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$DRY" = true ]; then
            EXTRA=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          else
            EXTRA=(OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN")
          fi
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet archive "${EXTRA[@]}"

      - name: Export the IPA
        if: steps.vc.outputs.go == 'true' && env.DRY != 'true'
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          WIDGETS_PROFILE_NAME: ${{ steps.profile.outputs.widgets }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
              <key>$WIDGETS_BUNDLE_ID</key><string>$WIDGETS_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <!-- The build number is the commit count; Xcode must not change it. -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -quiet
          ls -l "$RUNNER_TEMP/export"

      - name: Keep the IPA
        if: steps.vc.outputs.go == 'true' && env.DRY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asksiddha-ios-${{ steps.vc.outputs.vc }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: steps.vc.outputs.go == 'true' && env.DRY != 'true'
        env:
          VC: ${{ steps.vc.outputs.vc }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          # Also looks in ./private_keys, so run from the folder that holds it.
          cd "$RUNNER_TEMP"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo "### iOS build $VC uploaded to TestFlight"
            echo "- Apple processes it in about 10 to 30 minutes; the internal group \"Siddha Team\" then gets it."
            echo "- The external group (\"Friends and family\") needs it added in App Store Connect, which may ask for Beta App Review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/installed-profiles.txt" ]; then
            while IFS= read -r f; do rm -f "$f"; done < "$RUNNER_TEMP/installed-profiles.txt"
          fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/installed-profiles.txt" \
            "$RUNNER_TEMP/ci.mobileprovision" "$RUNNER_TEMP/ci-widgets.mobileprovision"
