<div class="public-scroll" [attr.inert]="updates.blocked() ? '' : null">
  <router-outlet />
</div>

@if (showAnimatedSplash()) {
  <div class="animated-splash-overlay" [class.light]="!theme.dark()" [class.fade-out]="animatedSplashFading()"
       (click)="finishAnimatedSplash()" role="button" tabindex="0" aria-label="Skip intro">
    <app-splash [dark]="theme.dark()" [duration]="splashDuration()" (finished)="finishAnimatedSplash()"></app-splash>
  </div>
}

@if (updates.blocked()) {
  <as-update-gate />
}
