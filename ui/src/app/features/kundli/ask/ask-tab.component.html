<nav class="ask-toolbar" aria-label="Ask controls">
  <h1 class="ask-title">Ask Siddha</h1>
  <div class="ask-actions">
  <div class="ask-links">
    <a [routerLink]="navigation.path()" title="New conversation"><lucide-icon name="pencil" [size]="18" />New chat</a>
    <a [routerLink]="navigation.path('history')" title="Conversation history"><lucide-icon name="history" [size]="18" />History</a>
    <a [routerLink]="navigation.path('memory')" title="Profile memory"><lucide-icon name="notebook-pen" [size]="18" />Memory</a>
  </div>
  <label>Reading style
    <select #mode [value]="preferences.experienceMode()" (change)="setMode(mode.value)">
      <option value="guided">Guided</option>
      <option value="balanced">Balanced</option>
      <option value="practitioner">Practitioner</option>
    </select>
  </label>
  </div>
</nav>
<div class="ask-workspace">
  @if (ready()) {
    <router-outlet />
  } @else if (loadError()) {
    <p role="alert">Could not load this profile.</p>
    <button type="button" (click)="loadProfile()">Try again</button>
  } @else {
    <p role="status">Loading profile...</p>
  }
</div>
