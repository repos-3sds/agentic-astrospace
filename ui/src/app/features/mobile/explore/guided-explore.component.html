@let p = profile();

<header class="guided-header">
  <button class="identity" type="button" (click)="profileSwitcherOpen.set(true)" aria-label="Switch profile">
    <span class="avatar" aria-hidden="true">{{ p.initial }}</span>
    <span class="identity-copy">
      <b>Namaste, {{ p.name }}</b>
      <span>Explore your way of life · Guided</span>
    </span>
  </button>
  <a class="accent-btn" [routerLink]="['/m', 'search']" aria-label="Search SIDDHA">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="8.75" cy="8.75" r="5.75"></circle>
      <path d="m13 13 4 4"></path>
    </svg>
  </a>
</header>

<main class="guided-body">
  <section class="title-block">
    <p>GUIDED COMPANION</p>
    <h1>Explore</h1>
  </section>

  <a class="story-card" [routerLink]="['/m', 'explore', 'story']">
    <span class="story-head">
      <span class="story-badge">
        <img class="story-icon" src="mobile/figma-guided-star.svg" alt="" aria-hidden="true" />
        <b>FEATURED</b>
      </span>
      <span class="story-dot" aria-hidden="true">
        <img src="mobile/figma-guided-star.svg" alt="" />
      </span>
    </span>
    <span class="story-copy">
      <b>Your Story</b>
      <span>Your life map - strengths, patterns, and themes translated into plain, useful guidance.</span>
    </span>
  </a>

  <section class="explore-list" aria-label="Guided explore areas">
    @for (card of cards; track card.title) {
      <a class="explore-card" [attr.data-tone]="card.tone" [routerLink]="card.route">
        <span class="card-icon">
          <img [src]="'mobile/' + card.icon + '.svg'" alt="" aria-hidden="true" />
        </span>
        <span class="card-copy">
          <b>{{ card.title }}</b>
          <span>{{ card.body }}</span>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>
    }
  </section>
</main>

@if (profileSwitcherOpen()) {
  <as-profile-switcher (dismissed)="profileSwitcherOpen.set(false)" />
}
