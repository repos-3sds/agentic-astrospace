<as-back-bar back="/m/today" crumb="Back" title="Notifications" />
<main>
  @if (loading()) {
    <p class="nc-empty">Loading notifications…</p>
  } @else if (error()) {
    <as-generic-error role="alert" message="Notifications are unavailable. Try again shortly." [technicalDetail]="error()!" (retried)="load()" />
  } @else {
    @if (actionError()) {
      <div class="nc-error" role="alert">Could not open that notification. Try again.</div>
    }
    @if (visibleAlerts().length) {
      <section class="nc-list">
        @for (a of visibleAlerts(); track a.id) {
          <button class="nc-row" [class.unread]="!a.read_at" [class.read]="!!a.read_at" type="button"
            [disabled]="readingId() === a.id" (click)="open(a)">
            <span class="nc-dot" aria-hidden="true"></span>
            <span class="nc-copy">
              <span class="nc-meta">
                <span>{{ categoryLabel(a.category) }}</span>
                @if (a.created_at) { <time [attr.datetime]="a.created_at">{{ when(a.created_at) }}</time> }
              </span>
              <b class="nc-title">{{ a.title }}</b>
              @if (a.body) { <span class="nc-body">{{ a.body }}</span> }
            </span>
          </button>
        }
      </section>
    } @else {
      <p class="nc-empty">You’re all caught up.</p>
    }
  }
</main>
