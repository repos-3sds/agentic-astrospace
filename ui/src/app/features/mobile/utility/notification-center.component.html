<header class="util-appbar"><a routerLink="/m/settings" aria-label="Back"><img src="mobile/back.svg" alt="" /></a><h1>Notifications</h1><span></span></header><main>
@if(loading()){<p class="util-empty">Loading notifications…</p>}@else if(error()){<as-generic-error role="alert" message="Notifications are unavailable. Try again shortly." [technicalDetail]="error()!" (retried)="load()" />}@else{@if(actionError()){<div class="util-inline-error" role="alert">Could not update notification · {{actionError()}}</div>}@for(a of visibleAlerts();track a.id){<button class="util-alert" [class.unread]="!a.read_at" type="button" [disabled]="readingId()===a.id" (click)="open(a)"><span>{{a.category==='transit'?'Transit':'Timing'}}</span><span><b>{{a.title}}</b><small>{{a.body}}</small></span></button>}@empty{<p class="util-empty">You’re all caught up.</p>}}</main>
