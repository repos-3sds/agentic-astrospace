<as-back-bar [back]="['/m','chart']" crumb="Chart" title="Birth details" lede="The inputs every line of your chart is computed from." />

<main>

  @if (loading()) {
    <p class="bds-state">Loading birth details…</p>
  } @else if (error()) {
    <div class="bds-state error">
      <p>{{ error() }}</p>
      <button type="button" (click)="load()">Try again</button>
    </div>
  } @else {
    <as-birth-details-card
      [chart]="chart()"
      [personName]="personName()"
      [profile]="profile()"
      density="full"
      tone="plain" />
  }
</main>
