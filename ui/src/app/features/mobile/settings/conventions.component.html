<a class="appbar" asStickyBar [asBack]="['/m', 'settings']">
  <img src="mobile/back.svg" alt="" aria-hidden="true" />
  <span class="crumb">Settings</span>
</a>

<div class="body">
  <header class="intro">
    <h1 class="title">Chart Method</h1>
    <!-- Not a recommendation. See the class comment: these are disputed, and
         the app states its default rather than calling the others wrong. -->
    <p class="lede">How your chart is worked out. Change these to match your family astrologer or tradition.</p>
  </header>

  @for (group of groups; track group.key) {
    <section class="group" role="radiogroup" [attr.aria-labelledby]="'conv-' + group.key">
      <h2 class="eyebrow" [id]="'conv-' + group.key">{{ group.eyebrow }}</h2>
      <p class="group-note">{{ group.note }}</p>
      @for (choice of group.choices; track choice.id) {
        @let on = selected(group.key) === choice.id;
        <button
          class="choice"
          type="button"
          role="radio"
          asSelectHaptic
          [class.is-on]="on"
          [attr.aria-checked]="on"
          (click)="choose(group.key, choice.id)"
        >
          <span class="mark radio" aria-hidden="true"></span>
          <span class="choice-copy">
            <span class="choice-label">{{ choice.label }}</span>
            <span class="choice-detail">{{ choice.detail }}</span>
          </span>
          @if (choice.isDefault) {
            <span class="choice-default">Default</span>
          }
        </button>
      }
    </section>
  }
</div>
