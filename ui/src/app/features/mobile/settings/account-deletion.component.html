<header><a routerLink="/m/settings/account" aria-label="Back"><img src="mobile/back.svg" alt="" /></a><h1>Account Security</h1><span></span></header><main><div class="danger-mark">!</div><h2>Delete Your Account?</h2><p>This action is permanent. You will lose your charts, Ask history, readings, saved timings, alerts, and preferences.</p><label class="agree"><input type="checkbox" [(ngModel)]="understood" />I understand this action cannot be undone</label><label class="confirm">TYPE DELETE TO CONFIRM<input [(ngModel)]="confirmation" autocomplete="off" /></label>@if(error()){<p class="error" role="alert">{{error()}}</p>}</main><footer><a routerLink="/m/settings/account">Keep My Account</a><button type="button" [disabled]="!understood || confirmation.trim().toUpperCase()!=='DELETE' || busy()" (click)="remove()">{{busy()?'Deleting…':'Delete Account'}}</button></footer>
