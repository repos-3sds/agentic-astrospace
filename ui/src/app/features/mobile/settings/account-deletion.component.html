<as-back-bar back="/m/settings/account" crumb="Account &amp; privacy" /><main><div class="danger-mark">!</div><h2>Delete your account?</h2><p>This action is permanent. You will lose your charts, Ask history, readings, saved timings, alerts, and preferences.</p><label class="agree"><input type="checkbox" [(ngModel)]="understood" />I understand this action cannot be undone</label><label class="confirm">TYPE DELETE TO CONFIRM<input [(ngModel)]="confirmation" autocomplete="off" /></label>@if(error()){<p class="error" role="alert">{{error()}}</p>}</main><footer><a routerLink="/m/settings/account">Keep my account</a><button type="button" [disabled]="!understood || confirmation.trim().toUpperCase()!=='DELETE' || busy()" (click)="remove()">{{busy()?'Deleting…':'Delete account'}}</button></footer>
