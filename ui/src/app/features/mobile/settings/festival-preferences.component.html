<a class="appbar" [asBack]="['/m', 'settings']">
  <img src="mobile/back.svg" alt="" aria-hidden="true" />
  <span class="crumb">Settings</span>
</a>

<div class="body">
  <header class="intro">
    <h1 class="title">Festivals to Show</h1>
    <p class="lede">Tick every tradition your home follows. You can pick more than one.</p>
  </header>

  <section class="choices" role="group" aria-label="Festival traditions">
    @for (choice of choices; track choice.id) {
      @let on = selected(choice.id);
      <button
        class="choice"
        type="button"
        role="checkbox"
        asSelectHaptic
        [class.is-on]="on"
        [attr.aria-checked]="on"
        (click)="toggle(choice.id)"
      >
        <span class="mark box" aria-hidden="true">{{ on ? '✓' : '' }}</span>
        <span class="choice-copy">
          <span class="choice-label">{{ choice.title }}</span>
          <span class="choice-detail">{{ choice.detail }}</span>
        </span>
      </button>
    }
  </section>

  <p class="local-note">At least one stays ticked. Festival dates follow sunrise in your city.</p>
</div>
