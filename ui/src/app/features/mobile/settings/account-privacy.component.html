<a class="appbar" [routerLink]="['/m', 'settings']">
  <img src="mobile/back.svg" alt="" aria-hidden="true" />
  <span class="crumb">Settings</span>
</a>

<div class="body">
  <header class="intro">
    <h1 class="title">Account &amp; privacy</h1>
    <p class="lede">Your data, in your control.</p>
  </header>

  <!-- Export first: data you cannot take with you is not yours. -->
  @for (action of actions; track action.id) {
    <button class="action" type="button" [disabled]="busy()" (click)="run(action.id)">
      <span class="action-label">{{ action.label }}</span>
      <img src="mobile/chevron.svg" alt="" aria-hidden="true" />
    </button>
  }
  @if (message()) { <p class="status" role="status">{{ message() }}</p> }
  @if (error()) { <p class="status error" role="alert">{{ error() }}</p> }

  <div class="rule"></div>

  <!--
    Not wired. The design has no confirmation step, and this destroys charts,
    notes and history irreversibly — see the class comment.
  -->
  <a class="action danger" routerLink="/m/settings/account/delete">
    <span class="action-label">Delete account</span>
    <img src="mobile/chevron-bad.svg" alt="" aria-hidden="true" />
  </a>

  <p class="consequence">
    Deleting your account permanently removes your charts, notes, and history.
    This can’t be undone.
  </p>
</div>
