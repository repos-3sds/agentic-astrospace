<as-back-bar back="/m/settings" crumb="More" title="Edit birth details" />
<main class="editbd-main">
  <aside class="editbd-warning">Updating details will recalculate your entire chart. This impacts your current planetary periods and transit dashboards.</aside>
  @if (loading()) { <p class="editbd-state">Loading profile…</p> }
  @else if (loadError(); as message) { <p class="editbd-state" role="alert">{{ message }}</p> }
  @else {
    <as-birth-details-form
      [initial]="initial()"
      [hideSelf]="hideSelf()"
      submitLabel="Save changes"
      busyLabel="Recalculating…"
      [saving]="saving()"
      [error]="error()"
      (submitted)="save($event)"
    />
  }
</main>
@if (saving()) { <as-chart-computing /> }
