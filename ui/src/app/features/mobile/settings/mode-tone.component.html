<a class="appbar" [asBack]="['/m', 'settings']">
  <img src="mobile/back.svg" alt="" aria-hidden="true" />
  <span class="crumb">Settings</span>
</a>

<div class="body">
  <header class="intro">
    <h1 class="title">Detail and tone</h1>
    <p class="lede">How much detail Siddha gives, and how it speaks to you. Change it anytime.</p>
  </header>

  <as-persona-picker [options]="options()" [persona]="persona()" (personaChange)="choose($event)" [(tone)]="tone" />

  <!--
    The point of the screen. The refer-out boundary is not a preference, and
    saying so here is cheaper than someone discovering it by hitting it.
  -->
  <p class="boundary">
    <img src="mobile/info.svg" alt="" aria-hidden="true" />
    <span>
      Health, legal, and money guidance always refers you to a professional —
      this setting never changes that.
    </span>
  </p>
</div>
