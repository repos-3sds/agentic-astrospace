<div class="shell">
  <main class="content" [class.tabs-hidden]="tabsSuppressed()">
    <router-outlet />
    @if (!tabsSuppressed() && tabPlanet(); as planet) {
      <as-tab-celestial-footer [planet]="planet" />
    }
  </main>

  @if (!tabsSuppressed()) {
    <nav class="tabbar" aria-label="Primary">
      @for (tab of tabs(); track tabTrack($index, tab)) {
        <a
          class="tab"
          [routerLink]="tabLink(tab)"
          (click)="onTabClick()"
          [class.is-active]="tabActive(tab)"
          [attr.aria-current]="tabActive(tab) ? 'page' : null"
        >
          <span
            class="icon"
            [style.--tab-icon]="'url(mobile/' + tab.icon + '.svg)'"
            aria-hidden="true"
          ></span>
          <span class="label">{{ tab.label }}</span>
        </a>
      }
    </nav>
  }
</div>
