<header class="recovery-appbar">
  <a class="recovery-back" routerLink="/m/auth" aria-label="Back to sign in">
    <img src="mobile/back.svg" alt="" aria-hidden="true" />
  </a>
  <p>New Password</p>
  <span aria-hidden="true"></span>
</header>

<main class="recovery-main">
  <section class="recovery-copy">
    <h1>Secure your space</h1>
    <p>Choose a new password for your AstroSpace account.</p>
  </section>

  <form (ngSubmit)="save()">
    <label for="new-password">NEW PASSWORD</label>
    <div class="recovery-field">
      <input
        id="new-password"
        name="password"
        [(ngModel)]="password"
        type="password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
      />
    </div>

    <label for="confirm-password">CONFIRM PASSWORD</label>
    <div class="recovery-field">
      <input
        id="confirm-password"
        name="confirmation"
        [(ngModel)]="confirmation"
        type="password"
        autocomplete="new-password"
        placeholder="Enter it again"
      />
    </div>

    @if (error()) {
      <p class="recovery-error" role="alert">{{ error() }}</p>
    }

    <button class="recovery-submit" type="submit" [disabled]="loading()">
      {{ loading() ? 'Saving…' : 'Save New Password' }}
    </button>
  </form>
</main>
