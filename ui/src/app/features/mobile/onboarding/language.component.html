<header class="topbar">
  <a [routerLink]="['/m', 'auth']" aria-label="Back">
    <img src="mobile/back.svg" alt="" aria-hidden="true" />
  </a>
  <p class="step">SETUP 1 OF 6</p>
</header>

<div class="top">
  <div class="art"><img src="mobile/language.svg" alt="" aria-hidden="true" /></div>
  <h1>Choose your language</h1>
  <p>Siddha answers in this language. You can change it anytime in Settings.</p>
  <div class="choices" role="radiogroup" aria-label="Language">
    <button type="button" role="radio" [class.is-on]="language() === 'en'" [attr.aria-checked]="language() === 'en'" (click)="choose('en')">
      <span>English</span><span class="radio"><img [src]="language() === 'en' ? 'mobile/check-language.svg' : 'mobile/radio-language.svg'" alt="" /></span>
    </button>
    <!-- Telugu answers come from the Ask agent in simple Telugu; the app
         chrome itself stays English. Settings > Language offers the same
         two choices and writes the same preference. -->
    <button type="button" role="radio" [class.is-on]="language() === 'te'" [attr.aria-checked]="language() === 'te'" (click)="choose('te')">
      <span><strong>తెలుగు</strong><small>Telugu</small></span><span class="radio"><img [src]="language() === 'te' ? 'mobile/check-language.svg' : 'mobile/radio-language.svg'" alt="" /></span>
    </button>
  </div>
</div>
<a class="continue" [routerLink]="['/m', 'welcome']">Continue</a>
