<header class="appbar">
  <h1 class="screen-title">Ask</h1>
  <a class="iconbtn" routerLink="/m/ask/history" aria-label="Past questions">
    <img src="mobile/history.svg" alt="" aria-hidden="true" />
  </a>
</header>

<div class="body">
  <div class="intro">
    <h2 class="ask-hero">{{ heading() }}</h2>
    <p class="lede">{{ lede() }}</p>
    <p class="safety">{{ safetyLine() }}</p>
  </div>
  @if (submitting()) {
    <p class="ask-state" role="status">Computing from your chart…</p>
  }
  @if (submitError()) {
    <p class="ask-state is-error" role="alert">{{ submitError() }}</p>
  }

  <div class="topics" role="group" aria-label="Narrow your question">
    @for (topic of topics(); track topic.id) {
      <button
        class="topic"
        type="button"
        [class.is-on]="topic.id === selectedTopic()"
        [attr.aria-pressed]="topic.id === selectedTopic()"
        (click)="toggleTopic(topic.id)"
      >
        <img [src]="'mobile/' + topic.icon + '.svg'" alt="" aria-hidden="true" />
        <span>{{ topic.label }}</span>
      </button>
    }
  </div>

  <p class="eyebrow">SUGGESTED FOR YOU RIGHT NOW</p>
  <div class="suggestions">
    @for (s of suggestions(); track s.prompt) {
      <button class="suggestion" type="button" (click)="ask(s.prompt)">
        <span class="suggestion-text">{{ s.prompt }} @if (s.because) { <small>{{ s.because }}</small> }</span>
        <img src="mobile/chevron.svg" alt="" aria-hidden="true" />
      </button>
    }
  </div>
</div>

<!--
  Pinned, not scrolled: the composer is the screen's only unconditional action,
  and a reader who has scrolled the suggestions should not have to scroll back
  to type.
-->
<as-ask-composer
  [inset]="true"
  [value]="draft()"
  placeholder="Type your question…"
  (valueChange)="draft.set($event)"
  (submitted)="ask($event)"
  (voiceRequested)="startListening()"
/>

@if (listening()) {
  <as-voice-listening
    [transcript]="heard()"
    (cancelled)="listening.set(false)"
    (confirmed)="acceptSpeech($event)"
  />
}
