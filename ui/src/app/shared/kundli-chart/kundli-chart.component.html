@if (chart(); as c) {
  <figure class="kundli-chart" [attr.aria-label]="c.name + ' kundli chart'">
    <svg viewBox="0 0 400 400" role="img">
      @switch (chartStyle()) {
        @case ('north') {
          <title>{{ c.name }} north Indian chart</title>
          <path class="chart-fill" d="M20 20H380V380H20Z" />
          <path class="chart-line strong" d="M20 20H380V380H20Z" />
          <path class="chart-line" d="M20 20L380 380M380 20L20 380" />
          <path class="chart-line strong" d="M200 20L380 200L200 380L20 200Z" />
          <path class="chart-line" d="M20 20L200 200L380 20M380 380L200 200L20 380" />
        }
        @case ('eastern') {
          <title>{{ c.name }} eastern Indian chart</title>
          <path class="chart-fill" d="M0 0H400V400H0Z" />
          <path class="chart-line strong" d="M0 0H400V400H0Z" />
          <path class="chart-line" d="M133.33 0V400M266.67 0V400M0 133.33H400M0 266.67H400" />
          <path class="chart-line" d="M0 0L133.33 133.33M266.67 133.33L400 0M0 400L133.33 266.67M266.67 266.67L400 400" />
        }
        @default {
          <title>{{ c.name }} south Indian chart</title>
          <path class="chart-fill" d="M0 0H400V400H0Z" />
          <path class="chart-line strong" d="M0 0H400V400H0Z" />
          <path class="chart-line" d="M100 0V400M200 0V100M200 300V400M300 0V400M0 100H400M0 200H100M300 200H400M0 300H400" />
        }
      }

      @for (region of regions(); track region.key) {
        @for (label of region.labels; track label.cls) {
          <text
            [attr.class]="label.cls"
            [attr.x]="label.x"
            [attr.y]="label.y"
            [attr.text-anchor]="label.anchor"
            [attr.fill]="label.fill"
            [style.font-size.px]="label.size"
          >{{ label.text }}</text>
        }
        @for (placed of region.entries; track placed.entry.key) {
          <g
            class="planet-hit"
            [class.interactive]="interactive() && placed.entry.key !== 'Lagna'"
            [attr.tabindex]="interactive() && placed.entry.key !== 'Lagna' ? 0 : null"
            [attr.role]="interactive() && placed.entry.key !== 'Lagna' ? 'button' : null"
            [attr.aria-label]="placed.entry.key"
            (click)="selectPlanet(placed.entry)"
            (keydown.enter)="selectPlanet(placed.entry)"
            (keydown.space)="selectPlanet(placed.entry)"
          >
            <rect [attr.x]="placed.hit.x" [attr.y]="placed.hit.y" [attr.width]="placed.hit.w" [attr.height]="placed.hit.h" rx="3" />
            <text class="planet-line" [attr.x]="placed.x" [attr.y]="placed.y" [style.font-size.px]="placed.size">
              <tspan>{{ placed.entry.label }}</tspan>
              @for (annotation of placed.entry.annotations; track annotation.code) {
                <tspan [attr.class]="'condition-symbol ' + annotation.tone" dx="3" [style.font-size.px]="placed.symbolSize">{{ annotation.symbol }}</tspan>
              }
            </text>
          </g>
        }
      }
    </svg>
  </figure>
  <div class="chart-legend" aria-label="Planet condition legend">
    <span><b>↑</b> Exalted</span>
    <span><b>↓</b> Debilitated</span>
    <span><b>↺</b> Retrograde</span>
    <span><b>☼</b> Combust</span>
    <span><b>✦</b> Vargottama</span>
  </div>
}
